name: nocyber-guard

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  guard:
    image: ${NCG_IMAGE:-ghcr.io/abingooo/nocyber-guard:latest}
    container_name: ${NCG_CONTAINER_NAME:-nocyber-guard}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${NCG_BIND_HOST:-127.0.0.1}:${NCG_PROXY_PORT:-18086}:8080"
      - "${NCG_ADMIN_BIND_HOST:-127.0.0.1}:${NCG_ADMIN_PORT:-19090}:9090"
    environment:
      - NCG_UPSTREAM_URL=${NCG_UPSTREAM_URL:?NCG_UPSTREAM_URL is required}
      - NCG_LISTEN_ADDR=0.0.0.0:8080
      - NCG_ADMIN_LISTEN_ADDR=0.0.0.0:9090
      - NCG_DATA_DIR=/data
      # Bare entries are omitted when undefined. This lets *_FILE work
      # without an empty direct value taking precedence inside the process.
      - NCG_MASTER_KEY
      - NCG_MASTER_KEY_FILE
      - NCG_INITIAL_ADMIN_PASSWORD
      - NCG_INITIAL_ADMIN_PASSWORD_FILE
      - NCG_TRUSTED_PROXY_CIDRS=${NCG_TRUSTED_PROXY_CIDRS:-}
      - NCG_AUDIT_BODY_LIMIT=${NCG_AUDIT_BODY_LIMIT:-4194304}
      - NCG_AI_CONCURRENCY=${NCG_AI_CONCURRENCY:-16}
      - NCG_AI_TIMEOUT=${NCG_AI_TIMEOUT:-15s}
      - NCG_AI_QUEUE_TIMEOUT=${NCG_AI_QUEUE_TIMEOUT:-2s}
      - NCG_ADMIN_COOKIE_SECURE=${NCG_ADMIN_COOKIE_SECURE:-false}
      - NCG_UPDATER_SOCKET
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ${NCG_DATA_PATH:-./data}:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      - upstream
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8080/_nocyber/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s
    logging: *default-logging

networks:
  upstream:
    name: ${NCG_NETWORK_NAME:-nocyber-guard}
    external: ${NCG_NETWORK_EXTERNAL:-false}
